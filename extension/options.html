<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TeamsHub - Domain Mappings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <div class="page-header">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="url(#g)"/>
        <path d="M8 10h5v2H8v-2zm0 3h8v2H8v-2zm0 3h6v2H8v-2z" fill="rgba(255,255,255,0.9)"/>
        <rect x="17" y="9" width="3" height="10" rx="1.5" fill="rgba(255,255,255,0.45)"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#4a9eff"/></linearGradient></defs>
      </svg>
      <div>
        <h1>Domain Mappings</h1>
        <p class="subtitle">These mappings control which Microsoft 365 domains route to which account.</p>
      </div>
    </div>
    <div id="status-bar" class="status-bar"></div>
    <table id="mappings-table">
      <thead>
        <tr>
          <th>Domain</th>
          <th>Account</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="mappings-body"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">
      No domain mappings yet. They will be created automatically when you first visit a Microsoft 365 site.
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
