<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      width: 320px;
      min-height: 100px;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .status {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .status.connected { color: #4ade80; }
    .status.disconnected { color: #ff6b6b; }
    .pending {
      padding: 12px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
      font-size: 12px;
      color: #aaa;
    }
    .pending strong { color: #ff9f43; }
    .pending .domain { color: #4a9eff; font-family: monospace; }
    .accounts {
      padding: 8px;
    }
    .accounts p {
      padding: 8px;
      color: #666;
      font-size: 13px;
      text-align: center;
    }
    .account-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: all 0.15s;
    }
    .account-btn:hover {
      background: #2a2a2a;
      border-color: #3a3a3a;
    }
    .account-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dismiss {
      display: block;
      width: calc(100% - 16px);
      margin: 4px 8px 8px;
      padding: 8px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    .dismiss:hover {
      background: #2a2a2a;
      color: #ccc;
    }
    .not-running {
      padding: 24px 16px;
      text-align: center;
      color: #888;
    }
    .not-running p { margin-bottom: 8px; }
    .not-running strong { color: #ff6b6b; }
    .footer {
      padding: 8px 16px;
      border-top: 1px solid #333;
      text-align: center;
    }
    .footer a {
      color: #4a9eff;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>TeamsHub</h1>
    <div id="status" class="status">Checking...</div>
  </div>
  <div id="pending-info" class="pending" style="display:none"></div>
  <div id="accounts" class="accounts"></div>
  <div id="not-running" class="not-running" style="display:none">
    <p><strong>TeamsHub is not running</strong></p>
    <p>Please open TeamsHub to route Microsoft 365 links to the right account.</p>
  </div>
  <div class="footer">
    <a id="options-link">Manage domain mappings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
