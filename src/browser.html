<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <div class="toolbar">
    <div class="tab-bar" id="tab-bar">
      <div class="tabs" id="tabs"></div>
      <button class="tab-new" id="new-tab-btn" title="New Tab">+</button>
    </div>
    <div class="nav-bar">
      <button class="nav-btn" id="btn-back" title="Back">←</button>
      <button class="nav-btn" id="btn-forward" title="Forward">→</button>
      <button class="nav-btn" id="btn-reload" title="Reload">↻</button>
      <input type="text" class="address-bar" id="address-bar" placeholder="Enter URL..." spellcheck="false">
    </div>
  </div>
  <div class="webview-container" id="webview-container"></div>

  <script src="browser.js"></script>
</body>
</html>
