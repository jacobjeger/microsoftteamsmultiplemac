<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams Launcher Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <h1>Teams Launcher</h1>
    <p class="subtitle">Manage your Teams accounts</p>

    <div id="account-list"></div>

    <button id="add-account" class="btn btn-add">+ Add Account</button>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">Add Account</h2>
      <div class="form-group">
        <label for="account-name">Account Name</label>
        <input type="text" id="account-name" placeholder="e.g. Acme Corp" maxlength="50" autofocus>
      </div>
      <div class="form-group">
        <label>Color</label>
        <div id="color-picker" class="color-picker"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
